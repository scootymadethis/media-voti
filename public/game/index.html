<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spaggiari 2 - Easter egg</title>
    <link rel="stylesheet" href="/common.css?v=5" />
    <link rel="stylesheet" href="game.css?v=4" />
  </head>
  <body>
    <div class="navbar">
      <div class="navbar-brand">
        <div class="navbar-brand-mark" onclick="goToHome()">S2</div>
        <div>
          <h1 class="title" onclick="goToHome()">Spaggiari 2</h1>
          <p class="navbar-subtitle">Easter egg</p>
        </div>
      </div>
      <div class="navbar-right">
        <div class="buttons" aria-label="Navigazione principale">
          <button
            type="button"
            class="btn-easter-egg"
            data-easter-egg-nav
            hidden
            aria-label="Easter egg"
            title="Easter egg"
            onclick="goToEasterEggGame()"
          >
            🤫
          </button>
          <button class="btn-secondary" type="button" onclick="goToOrario()">
            Orario
          </button>
          <button class="btn-secondary" type="button" onclick="goToVoti()">
            Voti
          </button>
          <button class="btn-secondary" type="button" onclick="goToAssenze()">
            Assenze
          </button>
          <button
            class="btn-admin"
            data-admin-nav
            hidden
            type="button"
            onclick="goToAdmin()"
          >
            Admin
          </button>
          <button type="button" onclick="logout()">Logout</button>
        </div>
        <button
          id="navToggle"
          class="navbar-toggle"
          type="button"
          aria-label="Apri menu"
          aria-expanded="false"
          aria-controls="mobileNavDrawer"
        >
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>

    <div
      id="mobileNavBackdrop"
      class="nav-drawer-backdrop"
      aria-hidden="true"
    ></div>
    <aside id="mobileNavDrawer" class="nav-drawer" aria-hidden="true">
      <div class="nav-drawer-header">
        <div>
          <h2>Menu</h2>
          <p class="navbar-subtitle">Navigazione rapida</p>
        </div>
        <button
          id="navDrawerClose"
          class="nav-drawer-close"
          type="button"
          aria-label="Chiudi menu"
        >
          ✕
        </button>
      </div>
      <div class="buttons">
        <button
          type="button"
          class="btn-easter-egg"
          data-easter-egg-nav
          hidden
          aria-label="Easter egg"
          onclick="goToEasterEggGame()"
        >
          🤫
        </button>
        <button class="btn-secondary" onclick="goToOrario()">Orario</button>
        <button class="btn-secondary" onclick="goToVoti()">Voti</button>
        <button class="btn-secondary" onclick="goToAssenze()">Assenze</button>
        <button class="btn-admin" data-admin-nav hidden onclick="goToAdmin()">
          Admin
        </button>
        <button onclick="logout()">Logout</button>
      </div>
    </aside>

    <main class="game-shell page-shell">
      <header class="game-header">
        <div>
          <h1>Modalità segreta</h1>
          <p>Accesso riservato. Buon divertimento.</p>
        </div>
      </header>
      <div id="gameContent"></div>
    </main>

    <script src="/session-auth.js?v=1"></script>
    <script src="/config.js?v=2"></script>
    <script src="/nav.js?v=2"></script>
    <script src="/easter-egg.js?v=2"></script>
    <script src="game.js?v=5"></script>
  </body>
</html>
