<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aulera</title>
    <link rel="stylesheet" href="/common.css?v=21" />
    <link rel="stylesheet" href="game.css?v=4" />
  </head>
  <body>
    <header class="navbar has-menu">
      <div class="navbar-brand">
        <div class="navbar-brand-mark" onclick="goToHome()">Au</div>
        <div><h1 class="title" onclick="goToHome()">Aulera</h1></div>
      </div>
      <nav class="buttons nav-center" aria-label="Navigazione principale">
        <button type="button" class="nav-link" id="homeBtn" onclick="goToHome()">Home</button>
        <button type="button" class="nav-link" id="orarioBtn" onclick="goToOrario()">Orario</button>
        <button type="button" class="nav-link" id="votiBtn" onclick="goToVoti()">Voti</button>
        <button type="button" class="nav-link" id="assenzeBtn" onclick="goToAssenze()">Assenze</button>
      </nav>
      <div class="navbar-actions">
        <button type="button" class="nav-link is-current btn-easter-egg" hidden data-easter-egg-nav aria-label="Easter egg" onclick="goToEasterEggGame()">Segreto</button>
        <button type="button" class="nav-link btn-admin" id="adminBtn" hidden data-admin-nav onclick="goToAdmin()">Admin</button>
        <button type="button" class="nav-link nav-exit" id="logoutBtn" onclick="logout()">Esci</button>
        <button id="navToggle" class="navbar-toggle" type="button" aria-label="Altro" aria-expanded="false" aria-controls="mobileNavDrawer"><span></span><span></span><span></span></button>
      </div>
    </header>

    <div
      id="mobileNavBackdrop"
      class="nav-drawer-backdrop"
      aria-hidden="true"
    ></div>
    <aside id="mobileNavDrawer" class="nav-drawer" aria-hidden="true">
      <div class="nav-drawer-header">
        <div>
          <h2>Menu</h2>
          <p class="navbar-subtitle">Stesse voci, stesso ordine</p>
        </div>
        <button
          id="navDrawerClose"
          class="nav-drawer-close"
          type="button"
          aria-label="Chiudi menu"
        >
          ✕
        </button>
      </div>
      <nav class="buttons">
          <button type="button" class="nav-link" onclick="goToHome()">Home</button>
          <button type="button" class="nav-link" onclick="goToOrario()">Orario</button>
          <button type="button" class="nav-link" onclick="goToVoti()">Voti</button>
          <button type="button" class="nav-link" onclick="goToAssenze()">Assenze</button>
          <button type="button" class="nav-link is-current btn-easter-egg" hidden data-easter-egg-nav aria-label="Easter egg" onclick="goToEasterEggGame()">Segreto</button>
          <button type="button" class="nav-link btn-admin" hidden data-admin-nav onclick="goToAdmin()">Admin</button>
          <button type="button" class="nav-link nav-exit" onclick="logout()">Esci</button>
      </nav>
    </aside>

    <main class="game-shell page-shell" data-reveal>
      <header class="game-header">
        <div>
          <h1>Modalità segreta</h1>
          <p>Accesso riservato. Buon divertimento.</p>
        </div>
      </header>
      <div id="gameContent"></div>
    </main>

    <script src="/session-auth.js?v=3"></script>
    <script src="/config.js?v=2"></script>
    <script src="/nav.js?v=4"></script>
    <script src="/motion.js?v=1"></script>
    <script src="/easter-egg.js?v=2"></script>
    <script src="game.js?v=5"></script>
  </body>
</html>
