<!doctype html>
<html lang="it" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#05070b" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Aulera: voti, agenda, bacheca e orario del registro ClasseViva in un'unica app, chiara e veloce. Accesso con SPID o CIE." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/png" href="/assets/logo-aulera.png" />
    <link rel="apple-touch-icon" href="/assets/logo-aulera.png" />
    <title>Aulera</title>
    <script>
      // Tema prima del primo paint (niente lampo chiaro/scuro).
      (function () {
        try {
          var p = JSON.parse(localStorage.getItem("aulera:theme") || '"auto"');
          var light = p === "light" || (p === "auto" && matchMedia("(prefers-color-scheme: light)").matches);
          document.documentElement.dataset.theme = light ? "light" : "dark";
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="/styles/app.css?v=1" />
    <link rel="stylesheet" href="/styles/views.css?v=1" />
    <link rel="stylesheet" href="/styles/views-registro.css?v=1" />
    <link rel="stylesheet" href="/styles/views-comunicazioni.css?v=1" />
    <link rel="stylesheet" href="/styles/views-account.css?v=1" />
  </head>
  <body>
    <div class="aurora" aria-hidden="true"></div>
    <!-- Rifrazione del "liquid glass" (usata solo su Chromium, su elementi piccoli). -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
      <filter id="liquid-glass" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.012 0.018" numOctaves="2" seed="2" result="noise" />
        <feGaussianBlur in="noise" stdDeviation="2" result="soft" />
        <feDisplacementMap in="SourceGraphic" in2="soft" scale="18" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>
    <div id="app" class="app"></div>
    <noscript><p style="padding:24px">Aulera richiede JavaScript.</p></noscript>
    <script src="/config.js?v=3"></script>
    <script src="/vendor/qrcode-generator-1.4.4.js" defer></script>
    <script src="/spid-app.js?v=3" defer></script>
    <!-- Versione degli asset: cambiala qui (anche in "v" sotto) a ogni rilascio del frontend. -->
    <script type="importmap">
      {
        "imports": {
          "aulera/main": "/app/main.js?v=1",
          "aulera/ui": "/app/ui.js?v=1",
          "aulera/api": "/app/api.js?v=1",
          "aulera/state": "/app/state.js?v=1",
          "aulera/grades": "/app/grades.js?v=1"
        }
      }
    </script>
    <script type="module">import "aulera/main";</script>
  </body>
</html>
